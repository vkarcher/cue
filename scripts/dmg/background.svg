<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title">
  <title id="title">Cue disk image background: drag Cue to Applications</title>
  <!-- Mid-tone so Finder's icon labels stay readable in both light (black) and dark (white) appearance. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#857368"/>
      <stop offset="1" stop-color="#6C5D54"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB340"/>
      <stop offset="1" stop-color="#E8530C"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#glow)"/>

  <text x="320" y="70" text-anchor="middle" fill="#FFF4EA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600">Drag Cue to Applications</text>

  <g id="arrow" fill="none" stroke="url(#orange)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 262 200 C 300 176, 340 176, 378 200"/>
    <path d="M 364 186 L 380 201 L 360 208"/>
  </g>

  <text x="320" y="356" text-anchor="middle" fill="#F3E4D8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Then open Cue, go to Game session and click Install.</text>
</svg>
